name: Codex Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  codex-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run safe review workflow
        run: pnpm codex:review

      - name: Review note
        run: |
          echo "This workflow performs local checks only."
          echo "It does not post comments and does not require write permissions or model API keys."
