name: Evals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-evals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic eval fixtures
        run: pnpm eval

  model-based-evals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optional model eval placeholder
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; skipping optional model-based evals."
            exit 0
          fi
          echo "Model-based evals require an eval runner such as Promptfoo to be installed intentionally."
          echo "Skipping by default; deterministic evals run without secrets."
