<script type="text/javascript">
    $(function () {
        var config = {
            '.chosen-select'           : {search_contains: true},
            '.chosen-select-deselect'  : {allow_single_deselect:true, search_contains: true},
            '.chosen-select-no-single' : {disable_search_threshold:10, search_contains: true},
            '.chosen-select-no-results': {no_results_text:'Oops, nothing found!', search_contains: true},
            '.chosen-select-width'     : {width:"95%", search_contains: true}
        }
        for (var selector in config) {
            $(selector).chosen(config[selector]);
        }
        setTimeout(function () {
            $('input[name="placement_name"]').focus();
        }, 1000);
        
        $('#btnCancelCreate').on('click', function () {
            setTimeout(function () {
                getPlacementList();
            }, 200);
        });
        $(document).ready(function(){
            // validate input only number
            allowNumber('txtShowAfter');
            allowNumber('txtAdDuration');
            allowNumber('txtShowFor');
            //allowNumber('txtWidth');
            //allowNumber('txtHeight');
            allowNumber('txtShowFor');
            allowNumber('txtMobileSizeWidth');
            allowNumber('txtMobileSizeHeight');
            allowNumber('txtAppSizeWidth');
            allowNumber('txtAppSizeHeight');
            allowNumber('txtMinDuration');
            allowNumber('txtMaxDuration');
            allowNumber('txtMinWidth');
            allowNumber('txtMaxWidth');
            allowNumber('txtMinHeight');
            allowNumber('txtMaxHeight');
            //allowNumber('txtPositionIndex');
        });

        $("#optAccounts,#optWebsites, #optZones, #optTypes,#optSize,#optMoblieSize,#optVideoFormat,#optApplication,#optPlatform").chosen({search_contains: true});
        changeOptionType(true);

        $('#optTypes').on('change', function(){
            changeOptionType(true);
        });
        $('#optSize').on('change', function(){
            setSize();
            if ($('#optSize option:selected').data('version') == 2) {
                $('.selector').show();
                $('#position').hide();
            } else {
                $('.selector').hide();
                $('#position').show();
            }
        });

        $('#txtShowSkip').on('change', function(){
            if ($('#txtShowSkip').prop('checked')) {
                $('.show-after').show();
            } else {
                $('.show-after').hide();
            }
        });
        $('#optPositionType').on('change', function() {
            disablePositionIndex();
        });
        disablePositionIndex();

        $('#setting_type').hide();
        $('#optPositionInsert').on('change', function() {
            if ($(this).val().trim().length == 0) {
                $('#setting_type').hide();
                $('#txtPositionName').val('');
                $('#txtPositionIndex').val(0);
            } else {
                $('#setting_type').show();
            }
        });

        $('#frmCreatePlacement').submit(function(e){
            e.preventDefault();
            var token = $('input[name="_token"]').val();
            var placement_name = $("#txtPlacementName").val();
            var accounts = $("#optAccounts").val();
            var websites = $("#optWebsites").val();
            var zones = $("#optZones").val();
            var width  = $('#txtWidth').val();
            var height = $('#txtHeight').val();
            var type = $("#optTypes").val();
            var setting = {};
            var size = $('#optSize').val();
            var video_format = $('#optVideoFormat').val();
            var show_skip = $('#txtShowSkip').prop('checked') ? 1 : 0;
            var show_autoplay = $('#optVideoAutoPlay').val();
            var show_after = $('#txtShowAfter').val();
            var minimum_ad_duration = $('#txtAdDuration').val();
            var showing_for = $('#txtShowFor').val();            
            var config = $('#optConfig').val();
            var platform = $('#optPlatform').val();
            var max_width  = $('#txtMaxWidth').val();
            var min_width = $('#txtMinWidth').val();
            var max_height  = $('#txtMaxHeight').val();
            var min_height = $('#txtMinHeight').val();
            var position_insert = $('#optPositionInsert').val();
            var position_index = $('input[name="position_index"]').val();
            var position_type = $('#optPositionType').val();
            var selector = $('#txtSelector').val();
            var from_index = $('#txtFromIndex').val();
            var position_name = $('input[name=position_name]').val();
            var position = {};
            setting['max_width'] = max_width;
            setting['min_width'] = min_width;
            setting['max_height'] = max_height;
            setting['min_height'] = min_height;
            setting['ad_unit'] = size;
            if(position_name != '' && position_insert.trim().length > 0) {
                position['insert'] = position_insert;
                position['type'] = position_type;
                position['name'] = position_name;
                if(position_type == 'class') {
                    position['index'] = position_index;
                }
                setting['position'] =  position;
            }
            if (selector) {
                setting['selector'] =  selector;
            }
            setting['from_index'] = from_index;
            var template = $('#txtNative_ad_format').val();
            if(template != '') {
                setting['template'] = template;
            }
            var min_duration = $('#txtMinDuration').val();
            var max_duration = $('#txtMaxDuration').val();
            if (type === 'video') {
                setting['video_ad_format'] = video_format;
                setting['config'] = config;
                setting['show_skip'] = show_skip;
                setting['show_autoplay'] = show_autoplay;
                setting['show_after'] = show_after;
                setting['showing_for'] = showing_for;
                setting['ad_duration'] = minimum_ad_duration;
                setting['min_duration'] = min_duration;
                setting['max_duration'] = max_duration;
            }
            if (type === 'application') {
                setting['application_os'] = platform;
            }  
            var active = ($('#chkActive').is(":checked")) ? 1 : 0;
            var notes = $("#txtNotes").val();
                    
            var data = {_token: token, placement_name: placement_name, accounts: accounts, websites: websites,zones:zones, type: type, setting:setting, width: width, height: height, active:active, notes: notes};
            $.post($(this).attr('action'), data, function(data){
                resetForm();
                setTimeout(function () {
                    $('input[name="placement_name"]').focus();
                }, 1000);
                showNotification(data.message, 'success');
            }).fail(function(jqXhr){
                if (jqXhr.status === 401) {
                    $(location).prop('pathname', 'auth/login');
                }
                if(jqXhr.status === 422) {
                    var errors = jqXhr.responseJSON;
                    if (errors.message) {
                        var errorsHtml = errors.message;
                    }else{
                        var errorsHtml = "<strong>Whoops!</strong> There were some problems with your input.";
                        var error_first = '';
                        $(".form-group").removeClass('has-error');
                        if ($.isPlainObject(errors)){
                            $.each(errors, function(k,v){
                                $('div').each(function(){
                                    if (error_first.length === 0){
                                        error_first = k;
                                    }
                                    $(this).find('#' + k).addClass('has-error');
                                });
                                if (v.length > 1){
                                    for (var i=0;i<v.length;i++){
                                        errorsHtml += '<li>' + v[i] + '</li>';
                                    }
                                }else{
                                    errorsHtml += '<li>' + v + '</li>';
                                }
                            });
                        }else{
                            errorsHtml += '<li>' + errors + '</li>';
                        }
                        errorsHtml += '';
                        $('input[name="'+ error_first +'"]').focus();
                    }
                }
                showNotification(errorsHtml, "error", '');
            });
        });
        /*==== END SUBMIT FORM CREATE  ====*/
    });
   
    function resetForm(){
        $("#frmCreatePlacement").trigger("reset");
        $("#optZones, #optSize, #optVideoFormat, #optConfig, #optPlatform, #optPositionType, #optPosition").trigger('chosen:updated');
        $(".form-group").removeClass('has-error');
        disablePositionIndex();
    }

    $('#CreatePlacement').bind('keyup', returnList);

    function returnList(e) {
        e.preventDefault();
        if (e.keyCode === 27) {
            setTimeout(function () {
                getPlacementList();
            }, 200);
            $('#CreatePlacement').unbind('keyup');
        }
    }

    
    function postAjax(url, data, callback){
        $.ajax({
                type:'POST',
                url:url,
                data:data,
                success: callback,
                error: function (data, textStatus, jqXHR) { notify(textStatus); }
            });
    }

    // change account get website, zone
    function getAllFromAccount(){
        $("#optAccounts").on('change', function(){ 
            var account_id = $(this).val();
            var url = '/placement/'+account_id+'/get';
            var account = {'account_id':account_id};
            postAjax(url, account, function(data){
                $('#optWebsites').empty();
                $('#optWebsites').append(data.website);
                $('#optWebsites').trigger("chosen:updated");
                $('#optZones').empty();
                $('#optZones').append(data.zone);
                $('#optZones').trigger("chosen:updated");
            });
        }); 
    }

    // chon website hien thi zone tuong ung website do.
    function getZone(){
        $("#optWebsites").on('change', function(){ 
            var website_id = $(this).val();
            var url = '/placement/'+website_id+'/zone';
            var website = {'website_id':website_id};
            postAjax(url, website, function(data){
                $('#optZones').empty();
                $('#optZones').append(data.zone);
                $('#optZones').trigger("chosen:updated");
            });
        });
    }
    getAllFromAccount();
    getZone();
    /*=======================*/
   
    // change option Type
    function changeOptionType(get_opt_size){
        var optType = $('#optTypes').val();
        switch(optType) {
            case 'display':
            case 'mobile':
                if (get_opt_size) {
                    getOptSize(optType);
                }                
                displaySizeField(true);
                displayVideoField(false);
                displayAppField(false);
                displaySettingMinMaxSize(true);
                break;
            case 'application':
                getOptSize(optType);
                displaySizeField(true);
                displayVideoField(false);
                displayAppField(true);
                displaySettingMinMaxSize(true);
                break;
            case 'video':
                getOptSize(optType);
                displaySizeField(true);
                displayVideoField(true);
                displayAppField(false);
                displaySettingMinMaxSize(false);
                setSize();
                break;
        }
    }

    function getOptSize(type) {
        $.get('/placement/' + type + '/get-ad-unit' , function(data){
            $('#optSize').empty();
            if (data && data.ad_unit !== false) {
                for (var index in data.ad_unit) {
                    var option = $(' <option value="' + data.ad_unit[index].id + '" data-width="' + data.ad_unit[index].width + '" data-height="' + data.ad_unit[index].height + '" data-version="' + data.ad_unit[index].version + '">' + data.ad_unit[index].creative_unit_name + '</option>');
                    $('#optSize').append(option);
                }
            }
            var optType = $('#optTypes').val();
            if (optType != 'video') {
                $('#optSize').append('<option value = "custom_size">Custom Size</option>');
            }
            $('#optSize').trigger("chosen:updated");
            setSize();
        }).fail(function (jqXhr){
            if (jqXhr.status === 401) {
                $(location).prop('pathname', 'auth/login');
            }
        });
    }

    function setSize() {
        var width = ($('#optSize option:selected').data('width') != undefined) ? $('#optSize option:selected').data('width') : 0;
        var height = ($('#optSize option:selected').data('height') != undefined) ? $('#optSize option:selected').data('height') : 0;
        $('#txtWidth').val(width);
        $('#txtHeight').val(height);
        if ($('#optSize').val() === 'custom_size') {
            $('.custom_size').show();
        } else {
            $('.custom_size').hide();
        }
    }

    function displaySizeField(show) {
        if (show) {
            $('.size').show();
            if ($('#optSize').val() === 'custom_size') {
                $('.custom_size').show();
            } else {
                $('.custom_size').hide();
            }
        } else {
            $('.size').hide();
        }
    }

    function displayVideoField(show) {
        if (show) {
            $('.video').show();
            if ($('#txtShowSkip').prop('checked')) {
                $('.show-after').show();
            } else {
                $('.show-after').hide();
            }
        } else {
            $('.video').hide();
        }
    }

    function displayAppField(show) {
        if (show) {
            $('.application').show();
        } else {
            $('.application').hide();
        }
    }


    function displaySettingMinMaxSize(show) {
        if (show) {
            $('.min_max_size').show();
        } else {
            $('.min_max_size').hide();
        }
    }
    
    function disablePositionIndex() {
        var type = $('#optPositionType').val();
        if(type == 'id') {
            $('input[name="position_index"]').prop('disabled', true);
        } else {
            $('input[name="position_index"]').prop('disabled', false);
        }
    }
    function allowNumber(id){
        jQuery('#'+id).keyup(function () {
            this.value = Math.abs(this.value.replace(/[^0-9\.]/g,'')).toLocaleString('en').replace('.',',');
            if( $('#optTypes').val() == 'video' ){
                if(this.value.length  >=3){return this.value = 30; }
                if(this.value  == 0 ){return this.value = 1; }
            }
        });
    }

    function displayPosition(show) {
        if (show) {
            $('#position').show();
        } else {
            $('#position').hide();
        }
    }
</script>
