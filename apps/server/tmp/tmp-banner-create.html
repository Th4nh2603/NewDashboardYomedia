                        </div>

                        <label for="txtSources" class="col-sm-3 control-label">Banner Link</label>
                        <div class="col-sm-6">
                           <input type="text" id="externalSources" name="" class="form-control" value="" placeholder="" maxlength="255">
                        </div>
                    </div>
                    <div id="settings"></div>
                    <div class="form-group" id="useTag">
                        <label for="optUseTag" class="col-sm-3 control-label">Use Tag</label>
                        <div class="col-sm-6">
                           <select id="optUseTag" name="use_tag" class="chosen-select form-control">
                                <option value="">None</option>
                                                                                                            <option value="ias">Integral Ad Science (IAS)</option>

                    </div>
                    <div class="form-group" id="codeTag">
                        <label for="txtCodeTag" class="col-sm-3 control-label">Code</label>

                        <label for="txtNotes" class="col-sm-3 control-label">Notes</label>

                        <div class="col-sm-6 switch">
                            <div class="onoffswitch">
                                <input type="checkbox" class="onoffswitch-checkbox" id="chkActive" name="active">
                                <label class="onoffswitch-label" for="chkActive">
                                    <span class="onoffswitch-inner"></span>

<script type="text/javascript">
    $(function () {
        configOption();
        //market change event
        $("#optMarkets").change(function(){
            var market = $(this).val();
            var ad_view = $('#optAdViews').val();
            getBannerFormat(market, ad_view);
        });

        //format change event
        $("#optTemplates").change(function(){
            var format_id = $(this).find(":selected").val();
            var type = $("#optTypes").find(":selected").val();
            if ($("#optTypes").val() == 'template') {
                getBannerSetting(format_id, type);
            }            
        });

        $("#optAdViews").change(function(){
            getBannerAdUnit($(this).val());
            var market = $('#optMarkets').val();
            var ad_view = $('#optAdViews').val();
            getBannerFormat(market, ad_view);
            $("#settings").html('');        
        });

        if ($("#optUseTag").val() === '') {
            $("#codeTag").hide();
        } else {
            $("#codeTag").show();
        }

        $("#optUseTag").change(function() {
            if ($("#optUseTag").val() === '') {
                $("#codeTag").hide();
            } else {
                $("#codeTag").show();
            }
        });
        checkType($("#optTypes").val());

        //type change event
        $("#optTypes").change(function(){
            selectedType = $(this).val();
            $("#settings").html('');
            switch (selectedType) {
                case 'local_file':
                    $(".local_source, #settings, #template").show();                    
                    $(".html_source, .external_source").hide();
                    break;
                case 'external_file':
                    $(".external_source, #settings, #template").show();
                    $(".html_source, .local_source").hide();
                    break;
                case 'html_code':
                    $(".html_source, #template").show();
                    $(".external_source, .local_source, #settings").hide();
                    break;
                case 'template':
                    $(".html_source, .local_source, .external_source").hide();
                    $("#settings, #template").show();
                    format_id = $("#optTemplates").find(":selected").val();
                    if (format_id) {
                        $.get('/banner/getSettings/'+format_id + '?type=' + selectedType, function(data){
                            $("#settings").html(data.html);
                        }).fail(function (jqXhr){
                            if (jqXhr.status === 401) {
                                $(location).prop('pathname', 'auth/login');
                            }
                        });
                    }
                    break;
            }
            
        });
        function checkType(val) {
            $("#settings").html('');
            switch (val) {
                case 'local_file':
                    $(".local_source, #settings, #template").show();                    
                    $(".html_source, .external_source").hide();
                    break;
                case 'external_file':
                    $(".external_source, #settings, #template").show();
                    $(".html_source, .local_source").hide();
                    break;
                case 'html_code':
                    $(".html_source, #template").show();
                    $(".external_source, .local_source, #settings").hide();
                    break;
                case 'template':
                    $(".html_source, .local_source, .external_source").hide();
                    $("#settings, #template").show();
                    format_id = $('#optTemplates').find(":selected").val();
                    type = $("#optTypes").find(":selected").val();
                    configSetting(format_id, type);
                    break;
            }
        }
        if ($("#optAdUnits").val()) {
            $("#txtHeight").val($("#optAdUnits").find(':selected').data('height'));
            $("#txtWidth").val($("#optAdUnits").find(':selected').data('width'));
        }
        $("#optAdUnits").change(function(){
            if($(this).val() == ''){
                $("#size").show();
            }else{                
                $("#size").hide();
            }
            $("#txtHeight").val($(this).find(':selected').data('height'));
            $("#txtWidth").val($(this).find(':selected').data('width'));
        });
        var market = $('#optMarkets').val();
        var ad_view = $('#optAdViews').val();
        getBannerFormat(market, ad_view);
        var format_id = $('#optTemplates').val();
        var type = $("#optTypes").val();
        if (format_id && type) {
            getBannerSetting(format_id, type);
        }        
    });
    
    function configOption(){
        setTimeout(function () {
            $('input[name="banner_name"]').focus();
        }, 1000);
        
        $('#btnCancelCreate').on('click', function () {
            setTimeout(function () {
                getBannerList();
            }, 200);
        });

        /*=============================================*/
        /* ACCOUNT, CATEGORY, MARKET, TIMEZONE CHOSEN  */
        /*=============================================*/

        var config = {
            '.chosen-select'           : {search_contains: true},
            '.chosen-select-deselect'  : {allow_single_deselect:true, search_contains: true},
            '.chosen-select-no-single' : {disable_search_threshold:10, search_contains: true},
            '.chosen-select-no-results': {no_results_text:'Oops, nothing found!', search_contains: true},
            '.chosen-select-width'     : {width:"95%", search_contains: true}
        }
        for (var selector in config) {
            $(selector).chosen(config[selector]);
        }
    }

    function returnList(e) {
        e.preventDefault();
        if (e.keyCode === 27) {
            setTimeout(function () {
                getBannerList();
            }, 200);
            $('#CreateBanner').unbind('keyup');
        }
    }

    function resetForm(){
        $("#frmCreateBanner").trigger("reset");
        $("#optTypes option, #optTemplates option, #optAccounts option, #optAdViews option").trigger('chosen:updated');
        $(".form-group").removeClass('has-error');
        $('.input-number').priceFormat({
            prefix: '',
            centsSeparator: '.',
            thousandsSeparator: ',',
            centsLimit: '0',
            limit:4
        });
    }

    $('#CreateBanner').bind('keyup', returnList);
    
    /*=============================================*/
    /*               SUBMIT FORM CREATE            */
    /*=============================================*/
    $('form[name="create_banner"]').submit(function(e){
        e.preventDefault();
        url = $(this).attr('action');
        var type = $("#optTypes").val();
        if(type == 'local_file'){
            var source =  $("#txtSources")[0].files[0];     
        }else{
            var source = (type=='external_file') ? $("#externalSources").val() : $("#htmlSources").val();
        }        
        var width = $("#txtWidth").unmask();
        var height = $("#txtHeight").unmask();
        var active = ($('#chkActive').is(":checked")) ? 1 : 0;
        
        var fd = new FormData($("#frmCreateBanner")[0]);
        
        var banner_settings = {};
        if(type!='html_code'){
            var settings = $("#optTemplates").find(":selected").data('setting');
            if(settings!=''){
                for(var k in settings){
                    if(settings[k].type == 'file' && type!='external_file'){  
                        banner_settings[k] = 'file';
                        fd.append("setting_"+k, ($("#setting_"+k)[0].files[0]));
                    }else if(settings[k].type == 'checkbox'){
                        var chkactive = ($("#setting_"+k).is(":checked")) ? 1 : 0; 
                        fd.append('setting_'+k, chkactive);
                        banner_settings[k] = chkactive;
                    } else if (settings[k].type == 'number') {
                        banner_settings[k] = $("#setting_"+k).unmask()
                    } else{
                        banner_settings[k] = $("#setting_"+k).val();    
                    }
                }
            }
        }
        banner_settings = JSON.stringify(banner_settings);
        fd.append('source', source);
        fd.append('width', width);
        fd.append('height', height);
        fd.append('active', active);
        fd.append('banner_settings', banner_settings);
        fd.append('ad_view', $('#optAdViews').val());
        $.ajax({
            type:'POST',
            url:url,
            data:fd,
            cache: false,
            processData: false,
            contentType: false,
            async: true,
            success:function(data){
                resetForm();
                setTimeout(function () {
                    $('input[name="banner_name"]').focus();
                }, 1000);
                showNotification(data.message, 'success');
            }
        }).fail(function(jqXhr){
            if (jqXhr.status === 401) {
                $(location).prop('pathname', 'auth/login');
            }
            if (jqXhr.status === 422) {
                var errors = jqXhr.responseJSON;
                if (errors.message) {
                    var errorsHtml = errors.message;
                }else{
                    var errorsHtml = "<strong>Whoops!</strong> There were some problems with your input.";
                    var error_first = '';
                    $(".form-group").removeClass('has-error');
                    if ($.isPlainObject(errors)){
                        $.each(errors, function(k,v){
                            $('div').each(function(){
                                if (error_first.length === 0){
                                    error_first = k;
                                }
                                if(k=='source'){
                                    $(this).find('#' + k).addClass('has-error');
                                    $(this).find('#externalSourceField').addClass('has-error');
                                    $(this).find('#htmlSourceField').addClass('has-error');
                                }else{
                                    $(this).find('#' + k).addClass('has-error');
                                    $(this).find('#' + k + "_field").addClass('has-error');
                                }

                                if(k=='width' || k=='height'){
                                    $(this).find("#" + k).addClass('has-error');
                                }
                            });
                            if (v.length > 1){
                                for (var i=0;i<v.length;i++){
                                    errorsHtml += '<li>' + v[i] + '</li>';
                                }
                            }else{
                                errorsHtml += '<li>' + v + '</li>';
                            }
                        });
                    }else{
                        errorsHtml += '<li>' + errors + '</li>';
                    }
                    errorsHtml += '';
                    $('input[name="'+ error_first +'"]').focus();
                }
            }
            showNotification(errorsHtml, 'error');
        });
        e.preventDefault();
    });
    /*==== END SUBMIT FORM CREATE  ====*/
</script>
