<script type="text/javascript">
$(function () {
    getPlacementList();
});

function getPlacementList() {
    $.post(publicUrl+'/placement/list', function (data) {
        $('#breadcrumb li').not('li:first').remove();
        $('#breadcrumb').append('<li class="active"><strong>Placements</strong></li>');
        $('#content').html(data.html);
    }).fail(function (jqXhr){
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
    });
}

function getPlacementCount() {
    $.get(publicUrl+'placement/count', function (data) {
        $('#ListCount').html(data.html);
    }).fail(function (jqXhr){
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
    });
}

function getPlacementCreateNew() {
    $.get(publicUrl+'placement/create', function (data) {
        $('#breadcrumb li').not('li:first').remove();
        $('#breadcrumb').append('<li><a href="javascript:void(0)" onclick="getPlacementList();">Placements</a></li><li class="active"><strong>Create</strong></li>');
        $('#content').html(data.html);
    }).fail(function (jqXhr){
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
        if (jqXhr.status === 422) {
            var errors = jqXhr.responseJSON;
            showNotification(errors.message, 'error');
        }
    });
}
function getPlacementEdit(id) {
     $.get(publicUrl+'placement/'+id+'/edit', function (data) {
        $('#breadcrumb li').not('li:first').remove();
        $('#breadcrumb').append('<li><a href="javascript:void(0)" onclick="getPlacementList();">Placements</a></li><li class="active"><strong>Edit</strong></li>');
        $('#content').html(data.html);
    }).fail(function (jqXhr){
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
        if (jqXhr.status === 422) {
            var errors = jqXhr.responseJSON;
            showNotification(errors.message, 'error');
        }
    });
}

function getPlacementDelete(id) {
    var selId = (id) ? [id] : getSelectedRows('ListGrid');
    if (!selId) {
        showNotification('No Placements selected', 'error');
    } else {
        var filter = $('#filter').val();
        if (filter === 'trash') {
            var content = '<p>Do you really want to delete the following placements:</p><ul>';
        } else {
            var content = '<p>Do you want to delete the following placements:</p><ul>';
        }
        var deleteId = [];
        var j = 0;
        for (var i = 0; i < selId.length; i++) {
                        var perms = ['manager'];
            var perm = $('#ListGrid').getCell(selId[i], 'permission');
            if (perms.indexOf(perm) >= 0){
                content += '<li>' + $('#ListGrid').getCell(selId[i], 'placement_name') + '</li>';
                deleteId[j] = selId[i];
                j++;
            }else{
                $("#jqg_ListGrid_"+selId[i]+".cbox").attr('checked', false);
            }
                    }
        if (deleteId.length > 0) {
            var footer = '<button type="button" class="btn btn-white" data-dismiss="modal">Cancel</button>\n\
                <button type="button" onclick="putPlacementDelete(\''+selId+'\')" class="btn btn-primary">OK</button>';
            showModalDialog(filter === 'trash' ? 'Destroy Placements' : 'Delete Placements', content, footer);
        }else{
            showNotification('placements.permission_not_delete', 'error');
        }     
    }
}

function putPlacementDelete(id) {
    hideModalDialog();
    var token = $('input[name="_token"]').val();
    var filter = $('#filter').val();
    var url = (filter === 'trash') ? publicUrl+'placement/destroy' : publicUrl+'placement/delete';
    var method = (filter === 'trash') ? 'delete' : 'put';
    var selId = (id) ? id.split(',') : getSelectedRows('ListGrid');
    $.ajax({
        url: url,
        method: method,
        data: {_token: token, filter: filter, id: selId}
    }).done(function (data) {
        showNotification(data.message, 'success');
        getPlacementCount();
        $("#ListGrid").trigger('reloadGrid');
    }).fail(function (jqXhr) {
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
        if(jqXhr.status === 422) {
            var errors = jqXhr.responseJSON;
            showNotification(errors.message, 'error');
        }
    });
}
function getPlacementRestore(id) {
    var selId = (id) ? [id] : getSelectedRows('ListGrid');
    if (!selId) {
        showNotification('No Placements selected', 'error');
    } else {
        var content = '<p>Do you want to restore the following placements:</p><ul>';
        for (var i = 0; i < selId.length; i++) {
            content += '<li>' + $('#ListGrid').getCell(selId[i], 'placement_name') + '</li>';
        }
        var footer = '<button type="button" class="btn btn-white" data-dismiss="modal">Cancel</button>\n\
                        <button type="button" onclick="putPlacementRestore(\''+ selId +'\')" class="btn btn-primary">OK</button>';
        showModalDialog('Restore Placements', content, footer);
    }
}
function putPlacementRestore(id) {
    hideModalDialog();
    var token = $('input[name="_token"]').val();
    var selId = (id) ? id.split(',') : getSelectedRows('ListGrid');
    $.ajax({
        url: publicUrl+'placement/restore',
        method: 'put',
        data: {_token: token, id: selId}
    }).done(function (data) {
        showNotification(data.message, 'success');
        getPlacementCount();
        $("#ListGrid").trigger('reloadGrid');
    }).fail(function (jqXhr) {
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
        if (jqXhr.status === 422) {
            var errors = jqXhr.responseJSON;
            showNotification(errors.message, 'error');
        }
    });
}
function getPlacementSearch() {
    $.get('/placement/search', function (data) {
        var html = data.html;
        var footer = '<button type="button" class="btn btn-white" data-dismiss="modal">Close</button>\n\
                      <button type="submit" onclick="postPlacementSearch();" class="btn btn-primary">Search</button>';
        showModalDialog('Search Placements', html, footer);
    }).fail(function (jqXhr) {
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
    });
}
function filterPlacement(e) {
    var id = $(e).attr('id');
    $('#ListCount').find('button').removeClass('active');
    $(e).addClass('active');
    $('#filter').val(id);
    var keyword = $('#frmFilter').find('input[name="keyword"]').val();
    $('#keyword').val(keyword);
    $('#optSel').val('');
    $('#listSearch').val('');
    var data_filter = {filter: $('#filter').val(),  keyword: keyword, field: '', opsel: ''};
    var url = $('#frmFilter').attr('action');
    if (id === 'trash') {
        $('#btnStatus').attr('disabled', true);
        $('#btnActive').attr('disabled', true);
        $('#btnExport').attr('disabled', true);
                    $('#btnDelete').attr('disabled', true);
            $('#btnRestore').attr('disabled', true);
                $('#ListGrid').jqGrid('hideCol', 'updated_at');
        $('#ListGrid').jqGrid('setGridParam', {url: url, postData: data_filter}).jqGrid('showCol', 'deleted_at').trigger('reloadGrid');
    } else {
        $('#btnRestore').attr('disabled', true);
        $('#btnDelete').removeAttr('disabled');
        $('#btnStatus').removeAttr('disabled');
        $('#btnActive').removeAttr('disabled');
        $('#btnExport').removeAttr('disabled');
        $('#ListGrid').jqGrid('showCol', 'updated_at');        
        $('#ListGrid').jqGrid('setGridParam', {url: url, postData: data_filter}).jqGrid('hideCol', 'deleted_at').trigger('reloadGrid');
    }
}

function getPlacementActive(id, e, v) {
    var selId = (id) ? [id] : getSelectedRows('ListGrid');
    if (!selId) {
        showNotification('No Placements selected', 'error');
    } else {
        if (e !== null) {
            $(e).hide().parent().append('<i class="fa fa-refresh fa-spin"></i>');
            var value = ($(e).find('i').data('value')) ? 0 : 1;
        } else {
            var value = (v === true) ? 1 : 0;
        }
        if (value == 1) {
            var content = '<p>Do you want to set active the following placements:</p><ul>';
        } else {
            var content = '<p>Do you want to set inactive the following placements:</p><ul>';
        }
        
        var activeId = [];
        var j = 0;
        
        for (var i = 0; i < selId.length; i++) {
                        var perms = ['manager','edit'];
            var perm = $('#ListGrid').getCell(selId[i], 'permission');
            if(perms.indexOf(perm) >= 0){
                content += '<li>' + $('#ListGrid').getCell(selId[i], 'placement_name') + '</li>';
                activeId[j] = selId[i];
                j++;
            }else{
                $("#jqg_ListGrid_"+selId[i]+".cbox").attr('checked', false);
            }
                    }
        
        if (activeId.length > 0) {
            var footer = '<button type="button" class="btn btn-white" data-dismiss="modal">Cancel</button>\n\
                <button type="button" onclick="putPlacementActive(\''+ selId +'\', ' + e + ', ' + v +')" class="btn btn-primary">OK</button>';
            showModalDialog(value===1?'Active Placements':'Inactive Placements', content, footer);
        } else {
            showNotification('placements.permission_not_active', 'error');
        }
    }
}

function putPlacementActive(id, e, v) {
    hideModalDialog();
    var selId = (id) ? id.split(',') : getSelectedRows('ListGrid');
    if (e !== null) {
        $(e).hide().parent().append('<i class="fa fa-refresh fa-spin"></i>');
        var value = ($(e).find('i').data('value')) ? 0 : 1;
    } else {
        var value = (v === true) ? 1 : 0;
    }
    var token = $('input[name="_token"]').val();
    $.ajax({
        url: publicUrl+'placement/active',
        method: 'put',
        data: {_token: token, active: value, id: selId}
    }).done(function (data) {
        if (e !== null) {
            $('.fa-refresh').remove();
            if (value) {
                $(e).show().find('.fa').removeClass('fa-eye-slash').addClass('fa-eye');
            } else {
                $(e).show().find('.fa').removeClass('fa-eye').addClass('fa-eye-slash');
            }
            $(e).find('i').data('value', value);
        } else {
            $("#ListGrid").trigger('reloadGrid');
        }
        showNotification(data.message, 'success');
        $("#ListGrid").trigger('reloadGrid');
    }).fail(function (jqXhr) {
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
        if (jqXhr.status === 422) {
            var errors = jqXhr.responseJSON;
            showNotification(errors.message, 'error');
        }
    });
}

function putPlacementClone(selId) {
    var token = $('input[name="_token"]').val();
    $.ajax({
        url: 'placement/clone',
        method: 'put',
        data: {_token: token, id: selId}
    }).done(function (data) {
        showNotification(data.message, 'success');
        $("#ListGrid").trigger('reloadGrid');
    }).fail(function (jqXhr) {
        if (jqXhr.status === 401) {
            $(location).prop('pathname', 'auth/login');
        }
        if (jqXhr.status === 422) {
            var errors = jqXhr.responseJSON;
            showNotification(errors.message, 'error');
        }
    });
}

function getShowHideColumn() {
    $.get(publicUrl+'placement/show-hide-column', function (data) {
        var html = data.html;
        var footer = '<button type="button" id="btnShowHideCol" class="btn btn-primary" onclick="excuteShowHideColumn();">OK</button>';
        showModalDialog('Show/Hide Columns', html, footer);
    });
}

function getPlacementCode(id) {
    window.location.target = '_blank';
    window.location.href = 'placement/' + id + '/code';
    return false;
}

function getPlacementCodeBDSP(id) {
    window.location.target = '_blank';
    window.location.href = 'placement/' + id + '/code-binding';
    return false;
}
