<script type="text/javascript">
    $(function () {
        $('.price').priceFormat({
            prefix: '',
            suffix: ' ' + $('#optAdvertisers').find(':selected').data('currency'),
            centsSeparator: '.',
            thousandsSeparator: ',',
            centsLimit: 2,
            limit:16
        });
        $('.input-number').priceFormat({
            prefix: '',
            suffix: '',
            centsSeparator: '.',
            thousandsSeparator: ',',
            centsLimit: 0,
            limit:16
        });
        $('.percent').priceFormat({
            prefix: '',
            suffix: ' %',
            centsSeparator: '.',
            thousandsSeparator: ',',
            centsLimit: 1,
            limit:3
        });
        
        setTimeout(function () {
            $('input[name="flight_name"]').focus();
        }, 1000);

        $('#btnCancelCreate').on('click', function () {
            setTimeout(function () {
                getFlightList();
            }, 200);
        });

        getCampaignList($("#optAdvertisers").val());

        $("#optAdvertisers").change(function() {
            getCampaignList($(this).val());
        });

        $("#optCampaigns").change(function() {
            var advertiser = $("#optAdvertisers").val();
            var market = $(this).find(':selected').data('market');
            var dl_campaign_id = $(this).find(':selected').data('dlcampaign');
            $('#txtDLCampaignId').val(dl_campaign_id);
            var campaign = $(this).val();
            $('.price').priceFormat({
                prefix: '',
                suffix: ' ' + $('#optAdvertisers').find(':selected').data('currency'),
                centsSeparator: '.',
                thousandsSeparator: ',',
                centsLimit: 2,
                limit:16
            });
            changeCampaign(advertiser, market, campaign);
        });
        $("#optBanners").change(function() {
            getBuyinngModel($('#optCampaigns').val(), $('#optBanners').val());
        });

        $('#optCreativeOptimization').change(function() {
            if ($(this).val() !== '') {
                $('#target_optimization').removeClass('hidden');
                $('#txtTargetOptimization').attr('readonly', false);
                $('#margin_allows').removeClass('hidden');
                $('#txtMarginAllows').attr('readonly', false);
            } else {
                $('#target_optimization').addClass('hidden');
                $('#txtTargetOptimization').attr('readonly', true);
                $('#margin_allows').addClass('hidden');
                $('#txtMarginAllows').attr('readonly', true);
            }
        });

        /*=========================================================*/
        /* ACCOUNT, CAMPAIGN, BANNER, PRODUCT, DELIVERY, CATEGORY  */
        /*=========================================================*/

        var config = {
            '.chosen-select'           : {search_contains: true},
            '.chosen-select-deselect'  : {allow_single_deselect:true, search_contains: true},
            '.chosen-select-no-single' : {disable_search_threshold:10, search_contains: true},
            '.chosen-select-no-results': {no_results_text:'Oops, nothing found!', search_contains: true},
            '.chosen-select-width'     : {width:"95%", search_contains: true}
        }
        for (var selector in config) {
            $(selector).chosen(config[selector]);
        }
        /*==== END ACCOUNT, CAMPAIGN, BANNER, PRODUCT, DELIVERY, CATEGORY CHOSEN ====*/
    });

    function returnList(e) {
        e.preventDefault();
        if (e.keyCode === 27) {
            setTimeout(function () {
                getFlightList();
            }, 200);
            $('#CreateFlight').unbind('keyup');
        }
    }

    function resetForm(){
        $(".form-group").removeClass('has-error');
        var advertiser = $('#optAdvertisers').val();
        $("#frmCreateFlight").trigger("reset");
        $("#optCampaigns, #optBanners, #optProducts, #optDeliveries, #optCategories, #optThirdTrackings, #optAudiences, #optBuyTypes").empty().append('<option value=""></option>').trigger('chosen:updated');
        $('#optBookingsType').empty().append('<option value="budget">Budget</option>').trigger('chosen:updated');
        getCampaignList(advertiser);
        $('#txtBookings, #txtAddedValue').priceFormat({
            prefix: '',
            suffix: '',
            centsSeparator: '.',
            thousandsSeparator: ',',
            centsLimit:0,
            limit:16
        });
        $('#optCreativeOptimization').val('').trigger('chosen:updated');
        $('#target_optimization').addClass('hidden');
        $('#margin_allows').addClass('hidden');
        $('.percent').priceFormat({
            prefix: '',
            suffix: ' %',
            centsSeparator: '.',
            thousandsSeparator: ',',
            centsLimit: 1,
            limit:3
        });
        unlockForm();
    }

    $('#CreateFlight').bind('keyup', returnList);

    function lockedForm() {
        $('#txtFlightName, #txtBookings, #txtAddedValue, #txtTargetOptimization, #txtMarginAllows, #txtNotes').attr('readonly','true');
        $('#optAdvertisers, #optCampaigns, #optBanners, #optProducts, #optDeliveries, #optCategories, #optThirdTrackings, #optAudiences, #optBuyTypes, #optBookingsType, #chkBookingsDaily, #optCreativeOptimization, #chkActive, #chkHiddenWA').attr('disabled','disabled');
        $('#btnSave').attr('disabled','disabled').append('<i class="fa fa-spinner fa-spin"></i>');
        $('#btnCancelCreate').attr('disabled','disabled');
    }

    function unlockForm() {
        $('#txtFlightName, #txtBookings, #txtAddedValue, #txtTargetOptimization, #txtMarginAllows, #txtNotes').removeAttr('readonly');
        $('#optAdvertisers, #optCampaigns, #optBanners, #optProducts, #optDeliveries, #optCategories, #optThirdTrackings, #optAudiences, #optBuyTypes, #optBookingsType, #chkBookingsDaily, #optCreativeOptimization, #chkActive, #chkHiddenWA').removeAttr('disabled');
        $('#btnSave').removeAttr('disabled').find('i').remove();
        $('#btnCancelCreate').removeAttr('disabled');
    }

    /*=============================================*/
    /*               SUBMIT FORM CREATE            */
    /*=============================================*/
    $('form[name="create_flight"]').submit(function(e){
        e.preventDefault();
        const token = $('input[name="_token"]').val();
        const flight_name = $("#txtFlightName").val();
        const advertiser = $("#optAdvertisers").val();
        const campaign = $("#optCampaigns").val();
        const banner = $("#optBanners").val();
        const product = $("#optProducts").val();
        const delivery = $("#optDeliveries").val();
        const total_day = $('#optDeliveries').find(':selected').data('total');
        const category = $("#optCategories").val();
        const third_trackings = $("#optThirdTrackings").val();
        const audience = $("#optAudiences").val();
        const buy_type = $("#optBuyTypes").val();
        const cost_type = $('#optBuyTypes').find(':selected').data('type');
        const cost_number = $('#optBuyTypes').find(':selected').data('number');
        const bookings_type = $("#optBookingsType").val();
        const bookings = accounting.unformat($('#txtBookings').val());
        const added_value = accounting.unformat($("#txtAddedValue").val());
        const booking_daily = ($('#chkBookingsDaily').prop("checked")) ? 1 : 0;
        const creative_optimization = $('#optCreativeOptimization').val();
        const target_optimization = accounting.unformat($('#txtTargetOptimization').val());
        const margin_allows = accounting.unformat($('#txtMarginAllows').val());
        const active = ($('#chkActive').prop("checked")) ? 1 : 0;
        const premium = ($('#chkPremium').prop("checked")) ? 1 : 0;
        const hiddenWA = ($('#chkHiddenWA').prop("checked")) ? 1 : 0;
        const notes = $('#txtNotes').val();
        const dl_campaign_id = $('#txtDLCampaignId').val();
        const dco = ($('#chkDCO').prop("checked")) ? 1 : 0;
        // Check the field is valid
        var errorsHtml = "<strong>Whoops!</strong> There were some problems with your input.";
        var errorFirst = '';

        if (errorFirst.length > 0) {
            $('input[name="'+ errorFirst +'"]').focus();
            showNotification(errorsHtml, "error");
        } else {
            lockedForm();
            const data = {_token: token, flight_name: flight_name, advertiser: advertiser, campaign: campaign, banner: banner, product: product, delivery: delivery, category: category, third_trackings: third_trackings, audience: audience, buy_type: buy_type, cost_type: cost_type, bookings_type: bookings_type, bookings: bookings, added_value: added_value, booking_daily: booking_daily, creative_optimization: creative_optimization, target_optimization: target_optimization, margin_allows: margin_allows, active:active, notes:notes, hiddenWA:hiddenWA, dco, dl_campaign_id, premium};
            $.post($(this).attr('action'), data, function(data){
                showNotification(data.message, "success");
                resetForm();
            }).fail(function(jqXhr){
                if (jqXhr.status === 401) {
                    $(location).prop('pathname', 'auth/login');
                }
                if (jqXhr.status === 422) {
                    var errors = jqXhr.responseJSON;
                    if (errors.message) {
                        var errorsHtml = errors.message;
                    }else{
                        var errorsHtml = "<strong>Whoops!</strong> There were some problems with your input.";
                        var error_first = '';
                        $(".form-group").removeClass('has-error');
                        if ($.isPlainObject(errors)){
                            $.each(errors, function(k,v){
                                $('div').each(function(){
                                    if (error_first.length === 0){
                                        error_first = k;
                                    }
                                    $(this).find('#' + k).addClass('has-error');
                                });
                                if (v.length > 1){
                                    for (var i=0;i<v.length;i++){
                                        errorsHtml += '<li>' + v[i] + '</li>';
                                    }
                                }else{
                                    errorsHtml += '<li>' + v + '</li>';
                                }
                            });
                        }else{
                            errorsHtml += '<li>' + errors + '</li>';
                        }
                        errorsHtml += '';
                        $('input[name="'+ error_first +'"]').focus();
                    }
                }
                showNotification(errorsHtml, 'error');
                unlockForm();
            });
        }
    });
    /*==== END SUBMIT FORM CREATE  ====*/
</script>
