services:
  server:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/server:/app
      # Avoid pnpm/esbuild EACCES on Windows bind mounts (rename into node_modules).
      - server_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - ./apps/server/.env.local
    command: >
      sh -c "
      apk add --no-cache python3 make g++ &&
      corepack enable &&
      corepack prepare pnpm@10.26.1 --activate &&
      pnpm install --prod=false --dangerously-allow-all-builds &&
      pnpm dev
      "

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - VITE_SERVER_URL=http://localhost:3001
    command: >
      sh -c "
      corepack enable &&
      corepack prepare pnpm@10.26.1 --activate &&
      pnpm install --prod=false --dangerously-allow-all-builds &&
      pnpm dev
      "

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  server_node_modules: