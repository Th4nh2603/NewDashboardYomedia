services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    command: >
      sh -c "
      corepack enable &&
      corepack prepare pnpm@10.26.1 --activate &&
      pnpm install --prod=false --dangerously-allow-all-builds &&
      pnpm dev
      "
