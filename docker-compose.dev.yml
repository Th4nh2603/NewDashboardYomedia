services:
  server:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/server:/app
    ports:
      - "3001:3001"
    env_file:
      - ./apps/server/.env.local
    command: >
      sh -c "
      corepack enable &&
      corepack prepare pnpm@10.26.1 --activate &&
      pnpm install --prod=false --dangerously-allow-all-builds &&
      pnpm dev
      "

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - VITE_SERVER_URL=http://localhost:3001
    command: >
      sh -c "
      corepack enable &&
      corepack prepare pnpm@10.26.1 --activate &&
      pnpm install --prod=false --dangerously-allow-all-builds &&
      pnpm dev
      "

